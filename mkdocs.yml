site_name: SIGEVA-UNC — Guía para investigadores
site_description: Manual de uso de SIGEVA-UNC elaborado por la SeICyT de la Facultad de Filosofía y Humanidades (UNC)
site_author: Secretaría de Investigación, Ciencia y Técnica — FFyH, UNC
site_url: https://ailcic.github.io/instructivosigevaffyh/
repo_url: https://github.com/ailcic/instructivosigevaffyh
repo_name: ailcic/instructivosigevaffyh
copyright: Secretaría de Investigación, Ciencia y Técnica — Facultad de Filosofía y Humanidades, Universidad Nacional de Córdoba · Texto y capturas bajo licencia <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es">CC BY-SA 4.0</a>
docs_dir: docs
exclude_docs: |
  _plantilla.md
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Primeros pasos:
      - Qué es SIGEVA y cómo se relaciona con CONICET y CVar: primeros-pasos/que-es.md
      - Crear usuario e ingresar: primeros-pasos/usuario.md
      - Roles: primeros-pasos/roles.md
      - Antes de empezar a cargar: primeros-pasos/antes-de-empezar.md
  - Cargar tu CV:
      - Cómo funcionan las pantallas y los formularios: cv/mecanica.md
      - ¿Dónde cargo cada cosa?: cv/donde-cargar.md
      - Autores, palabras clave e instituciones: cv/campos-comunes.md
      - Datos personales: cv/datos-personales.md
      - Formación: cv/formacion.md
      - Cargos (docencia, I+D, gestión): cv/cargos.md
      - Antecedentes: cv/antecedentes.md
      - Publicaciones: cv/produccion-cientifica.md
      - Desarrollos, servicios y bienes intensivos en conocimiento: cv/produccion-tecnologica.md
      - Producción artística: cv/produccion-artistica.md
      - Otros antecedentes: cv/otros.md
      - CV adjunto e impresión: cv/adjunto-impresion.md
  - Sincronizar datos: sincronizacion/index.md
  - Proyectos y trámites: proyectos-y-tramites/index.md
  - Preguntas frecuentes: faq.md
  - Glosario: glosario.md
  - Registro de cambios: cambios.md
