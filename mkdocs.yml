site_name: SIGEVA-UNC — Guía para investigadores
site_description: Manual de uso de SIGEVA-UNC elaborado por la SeICyT de la Facultad de Filosofía y Humanidades (UNC)
site_author: Secretaría de Investigación, Ciencia y Técnica — FFyH, UNC
docs_dir: docs
exclude_docs: |
  _plantilla.md
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Aspectos generales:
      - Qué es SIGEVA y cómo se relaciona con CONICET y CVar: primeros-pasos/que-es.md
      - Crear usuario e ingresar: primeros-pasos/usuario.md
      - Roles: primeros-pasos/roles.md
  - Banco de datos:
      - Navegación general: cv/navegacion.md
      - Tablas y formularios: cv/mecanica.md
      - Instituciones, revistas, autores, áreas y palabras clave: cv/campos-comunes.md
      - Datos personales: cv/datos-personales.md
      - Experticia en CyT: cv/experticia.md
      - Formación: cv/formacion.md
      - Cargos: cv/cargos.md
      - Antecedentes: cv/antecedentes.md
      - "Producciones y servicios: publicaciones": cv/publicaciones.md
      - "Producciones y servicios: desarrollos, servicios y bienes": cv/desarrollos-servicios.md
      - "Producciones y servicios: producción artística": cv/produccion-artistica.md
      - Otros antecedentes: cv/otros.md
      - Currículum adjunto e impresión del CV: cv/adjunto-impresion.md
  - Compartir e importar datos: sincronizacion/index.md
  - Trámite: proyectos-y-tramites/index.md
  - Preguntas frecuentes: faq.md
  - Glosario: glosario.md
  - Registro de cambios: cambios.md
